[package]
name = "stryker-mutator-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
blake3 = "1.8"
globset = "0.4"
getrandom = "0.4"
jsonschema = { version = "0.58", default-features = false }
jsonc-parser = { version = "0.34", features = ["serde"] }
napi = { version = "3.14", default-features = false, features = ["napi8", "dyn-symbols"] }
napi-derive = "3.5"
oxc_allocator = "0.154.0"
oxc_ast = "0.154.0"
oxc_ast_visit = "0.154.0"
oxc_codegen = "0.154.0"
oxc_parser = "0.154.0"
oxc_regular_expression = "=0.154.0"
oxc_semantic = "0.154.0"
oxc_span = "0.154.0"
oxc_syntax = "0.154.0"
regex = "1"
rsvelte_core = { git = "https://github.com/baseballyama/rsvelte", rev = "5ed8ea3a3401b9fbbe780d3b18d6f90073291d6b", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
swc_atoms = "=10.0.0"
swc_common = "=26.0.0"
swc_html_ast = "=26.0.0"
swc_html_parser = "=26.1.0"
tokio = { version = "1.53", features = ["rt", "net", "process", "time", "sync", "io-util", "io-std", "macros"] }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "process"] }

[target.'cfg(windows)'.dependencies]
dunce = "1.0.5"
junction = { version = "2.1", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_System_Environment", "Win32_System_JobObjects", "Win32_System_IO", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[build-dependencies]
napi-build = "2.6"

[profile.release]
lto = "thin"
strip = "symbols"
