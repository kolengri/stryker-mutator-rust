[package]
name = "stryker-mutator-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
blake3 = "1.8"
napi = { version = "3.14", default-features = false, features = ["napi8", "dyn-symbols"] }
napi-derive = "3.5"
oxc_allocator = "0.154.0"
oxc_ast = "0.154.0"
oxc_ast_visit = "0.154.0"
oxc_codegen = "0.154.0"
oxc_parser = "0.154.0"
oxc_semantic = "0.154.0"
oxc_span = "0.154.0"
oxc_syntax = "0.154.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[build-dependencies]
napi-build = "2.6"

[profile.release]
lto = "thin"
strip = "symbols"
